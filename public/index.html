<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホ利用記録</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    h2 {
      text-align: center;
    }

    button {
      font-size: 18px;          /* 文字を大きく */
      padding: 12px 24px;       /* ボタンの面積を大きく */
      margin: 8px 0;            /* ボタン間の余白 */
      border-radius: 8px;       /* 角丸 */
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      width: 100%;              /* 幅いっぱいに */
      max-width: 300px;         /* 最大幅を設定 */
      display: block;           /* ブロックにして縦に並べる */
    }

    button:hover {
      background-color: #45a049;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      padding: 8px;
      text-align: center;
      border: 1px solid #ddd;
    }

    @media (min-width: 600px) {
      button {
        width: auto; /* PC は幅を自動調整 */
      }
    }
  </style>
</head>
<body>
  <h2>スマホ利用記録</h2>

  <p>目的を選んでください</p>
  <button onclick="sendLog('SNS')">SNS</button>
  <button onclick="sendLog('調べ物')">調べ物</button>
  <button onclick="sendLog('連絡')">連絡</button>

  <hr>

  <button onclick="showLogs()">履歴を見る</button>
  <p id="rate"></p>

  <table>
    <thead>
      <tr>
        <th>日時</th>
        <th>目的</th>
        <th>結果</th>
      </tr>
    </thead>
    <tbody id="logTable"></tbody>
  </table>

  <script>
    let userId = localStorage.getItem("userId");
    if (!userId) {
      userId = crypto.randomUUID();
      localStorage.setItem("userId", userId);
    }

    function formatDate(dateString) {
      const d = new Date(dateString);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const h = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${y}-${m}-${day} ${h}:${min}`;
    }

    function sendLog(purpose) {
      fetch("/log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          userId: userId,
          purpose: purpose,
          success: confirm("目的通り使えましたか？")
        })
      })
      .then(res => res.json())
      .then(data => alert(data.message));
    }

    function showLogs() {
      fetch(`/logs/${userId}`)
        .then(res => res.json())
        .then(data => {
          const table = document.getElementById("logTable");
          table.innerHTML = "";

          const rateArea = document.getElementById("rate");
          const total = data.length;
          const successCount = data.filter(log => log.success).length;

          if (total === 0) {
            rateArea.textContent = "まだ記録がありません";
          } else {
            const percent = Math.round((successCount / total) * 100);
            rateArea.textContent = `成功率：${percent}%（${successCount} / ${total}）`;
          }

          data.forEach(log => {
            const row = document.createElement("tr");

            const dateCell = document.createElement("td");
            dateCell.textContent = formatDate(log.date);

            const purposeCell = document.createElement("td");
            purposeCell.textContent = log.purpose;

            const resultCell = document.createElement("td");
            resultCell.textContent = log.success ? "成功" : "失敗";

            row.appendChild(dateCell);
            row.appendChild(purposeCell);
            row.appendChild(resultCell);

            table.appendChild(row);
          });
        });
    }
  </script>
</body>
</html>
